name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs Go, gopls, Node and Prettier at the versions pinned in mise.toml, matching the local gate.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.9
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: make check

  reposition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python3 tools/reposition_bundle.py rebuild
      - run: cd vendor/reposition/0.2.0.dev2+triage.2 && python3 -m pip install --no-index --no-deps --require-hashes -r requirements.txt
      - run: python3 -m unittest discover -s tests -p test_reposition.py -v
      - run: python3 -m unittest discover -s tests -p test_evidence_workflow.py -v
      - run: python3 tools/reposition_compat.py
